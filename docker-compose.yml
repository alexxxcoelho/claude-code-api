version: '3.8'

services:
  claude-api:
    build: .
    container_name: claude-code-api
    ports:
      - "3000:3000"
    environment:
      # Auth: oauth (subscription) mode + token from `npm run login`
      - AUTH_MODE=${AUTH_MODE:-oauth}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # API-key mode alternative (only used when AUTH_MODE is unset)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Client auth + tool/model policy
      - PROXY_API_KEY=${PROXY_API_KEY}
      - CLAUDE_TOOLS=${CLAUDE_TOOLS-}
      - CLAUDE_SKIP_PERMISSIONS=${CLAUDE_SKIP_PERMISSIONS:-false}
      - MODEL_ALIASES=${MODEL_ALIASES-}
      - POOL_SIZE=${POOL_SIZE:-5}
      - IDLE_TIMEOUT_MS=${IDLE_TIMEOUT_MS:-300000}
      - PORT=3000
      - WORKSPACE_DIR=/workspace
    volumes:
      # Mount your project files here
      - ./workspace:/workspace
      # Persist Claude sessions across container restarts (non-root `node` user)
      - claude-sessions:/home/node/.claude
    restart: unless-stopped
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  claude-sessions:
    name: claude-code-sessions
